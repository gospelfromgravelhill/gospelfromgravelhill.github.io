# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#

# Site settings
title: "The Gospel from Gravel Hill"
subtitle: "…the glorious gospel of the blessed God… —1 Timothy 1:11"
description: "The Gospel proclaimed from Gravel Hill"
author: "Marc MacArthur"

lang: "en-CA"
timezone: "America/Halifax"

url: "https://gospel.fromgravelhill.ca"
baseurl: ""

# Jekyll settings
permalink: /:year/:month/:day/:title/
markdown: kramdown
theme: null

# Google Analytics
google_analytics: "G-R9BBEB12ES"

# Plugins
plugins:
  - jekyll-paginate-v2

# Pagination defaults
pagination:
  enabled: true
  collection: posts
  per_page: 10
  sort_field: "date"
  sort_reverse: true

# Main navigation
navigation:
  - title: "Home"
    url: "/"

  - title: "Recent"
    url: "/recent/"

  - title: "About"
    url: "/about/"

  - title: "Audio"
    url: "/audio/"

  - title: "Articles"
    url: "/articles/"

  - title: "Tracts"
    url: "/tracts/"

  - title: "Books"
    url: "/books/"

  - title: "Contact"
    url: "/contact/"

  - title: "Search"
    url: "/search/"
